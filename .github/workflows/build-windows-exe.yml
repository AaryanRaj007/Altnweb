name: Build Native Windows EXE Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PySide6-Addons pyinstaller yt-dlp

      - name: Download Standalone yt-dlp Windows Binary
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o Davinci_plugins/yt-dlp.exe

      - name: Build Application Directory with PyInstaller
        run: |
          cd Davinci_plugins
          pyinstaller --onedir --windowed --name=Altn_MediaDownloader --hidden-import=PySide6.QtWebEngineWidgets --hidden-import=PySide6.QtWebEngineCore --hidden-import=PySide6.QtWebChannel run_app.py
          copy yt-dlp.exe dist\Altn_MediaDownloader\

      - name: Compile Inno Setup Installer Wizard
        run: |
          cd Davinci_plugins
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altn_YouTube_Downloader_Installer_Windows
          path: Davinci_plugins/dist_setup/Altn_YouTube_Downloader_Installer.exe
