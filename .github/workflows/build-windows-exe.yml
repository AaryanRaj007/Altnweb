name: Build Native Windows EXE Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PySide6-WebEngine pyinstaller

      - name: Build Windows Executable with PyInstaller
        run: |
          cd Davinci_plugins
          pyinstaller --onefile --windowed --name=Altn_YouTube_Downloader_Installer --add-data="YouTubeDownloader;YouTubeDownloader" --hidden-import=PySide6.QtWebEngineWidgets --hidden-import=PySide6.QtWebEngineCore --hidden-import=PySide6.QtWebChannel gui_installer.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altn_YouTube_Downloader_Installer_Windows
          path: Davinci_plugins/dist/Altn_YouTube_Downloader_Installer.exe
